services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    environment:
      CLICKHOUSE_DB: ${CH_DB}
      CLICKHOUSE_USER: ${CH_USER}
      CLICKHOUSE_PASSWORD: ${CH_PASS}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d
      - ch_data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  generator:
    # Opt-in: run with `docker compose --profile generator up --build`
    profiles: ["generator"]
    build: ./generator
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CH_HOST: clickhouse
      CH_USER: ${CH_USER}
      CH_PASSWORD: ${CH_PASS}
      CH_DB: ${CH_DB}
      # New customers per second across all processes. Each customer sends about 8.4
      # events over about 2.5 hours, so the event rate reaches steady state after about
      # 3 hours (or straight away with BACKFILL_HOURS). About 1,190 gives 10k events/sec.
      ARRIVALS_PER_SEC: ${ARRIVALS_PER_SEC:-20}
      PROCESSES: ${PROCESSES:-1}
      BATCH_SIZE: ${BATCH_SIZE:-10000}
      FLUSH_SECONDS: ${FLUSH_SECONDS:-1}
      # Opt-in: build this many hours of history at startup, then run in real time.
      BACKFILL_HOURS: ${BACKFILL_HOURS:-0}

volumes:
  ch_data:
